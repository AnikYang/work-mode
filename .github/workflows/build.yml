name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run core checks
        run: bash scripts/test.sh
      - name: Build and package Apple Silicon app
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Mode-Apple-Silicon
          path: |
            build/Work-Mode-arm64.zip
            build/SHA256SUMS.txt
          retention-days: 14
