name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: bash scripts/build.sh
      - name: Run core checks
        run: bash scripts/test.sh
      - name: Package app
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Mode-Apple-Silicon
          path: build/Work-Mode-*.zip
          retention-days: 14
