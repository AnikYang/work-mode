name: Publish Work Mode v1.3.2

on:
  push:
    branches: [codex/publish-work-mode-1.3.2]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'AnikYang/work-mode'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa7d9399b6de0154419890bebea15e4987d1ac30
      - name: Run core checks
        run: bash scripts/test.sh
      - name: Package and verify
        run: |
          set -euo pipefail
          bash scripts/package.sh
          cd build
          shasum -a 256 -c SHA256SUMS.txt
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'Work Mode.app/Contents/Info.plist')" == '1.3.2' ]]
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/work-mode-notes.md" <<'NOTES'
          **[下载 Work Mode v1.3.2](https://github.com/AnikYang/work-mode/releases/download/v1.3.2/Work-Mode-arm64.zip)** · Apple Silicon · macOS 14+

          - 点击开启或关闭提示中的齿轮，设置和胶囊会同时显示。关闭设置后收起胶囊。
          - 菜单栏新增「登录时启动」。开启后，下次登录 macOS 时 Work Mode 会在菜单栏运行，防休眠由你手动开启。

          解压后将 `Work Mode.app` 拖入“应用程序”。升级时请先退出旧版。安装包采用 ad-hoc 签名，尚未公证。校验值见 `SHA256SUMS.txt`。

          The status capsule stays visible while settings are open. The menu now includes an opt-in Launch at Login switch.
          NOTES
          gh release create v1.3.2 \
            build/Work-Mode-arm64.zip build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target aa7d9399b6de0154419890bebea15e4987d1ac30 \
            --title "Work Mode v1.3.2 — 胶囊保留与登录时启动" \
            --latest --notes-file "$RUNNER_TEMP/work-mode-notes.md"
